</head><body>
<main id="app" aria-live="polite"></main>
<script>
(() => {'use strict';
const LS='petualangan-bilangan-bulat-v1';
const root=document.getElementById('app');
const defaults={student:'',studentCode:'',studentClass:'',teacher:'',school:'SDN Kecipir 01',teacherPin:'',visited:[],gameStars:0,studentProgress:{},quizHistory:[],quizDraft:null,customQuestions:[],schoolUpdatedToKecipir:true};
let state=load(),role='choose',page='choose',verified=false,lesson=0,lessonStep=0,lineStart=-3,lineMove=5,game='mobil',round=0,gamePoints=0,gameQ=null,gameAnswered=false,quiz=[],quizIndex=0,quizResponses=[],quizAnswered=false,reviewData=null,teacherSearch='';
function load(){let raw={};try{raw=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){}const d={...defaults,...raw};if(!d.schoolUpdatedToKecipir){d.school='SDN Kecipir 01';d.schoolUpdatedToKecipir=true}if(!d.school)d.school='SDN Kecipir 01';for(const k of ['visited','quizHistory','customQuestions'])if(!Array.isArray(d[k]))d[k]=[];if(!d.studentProgress||typeof d.studentProgress!=='object'||Array.isArray(d.studentProgress))d.studentProgress={};d.student=String(d.student||'');d.studentCode=String(d.studentCode||'');d.studentClass=String(d.studentClass||'');d.teacher=String(d.teacher||'');d.teacherPin=String(d.teacherPin||'');d.gameStars=Number(d.gameStars)||0;return d}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n<0?'−'+Math.abs(n):'+'+n;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
function studentKey(name=state.student,code=state.studentCode,klass=state.studentClass){const k=String(klass||'').trim(),c=String(code||'').trim(),n=String(name||'').trim();return(k?'kelas:'+k.toLocaleLowerCase('id-ID')+'|':'')+(c?'id:'+c.toLocaleLowerCase('id-ID'):'nama:'+n.toLocaleLowerCase('id-ID'))}
function currentKey(){return studentKey()}
function storeProgress(){state.studentProgress[currentKey()]={visited:[...state.visited],gameStars:Number(state.gameStars)||0}}
function save(){try{storeProgress();localStorage.setItem(LS,JSON.stringify(state));return true}catch(e){toast('Penyimpanan penuh atau tidak tersedia');return false}}
function switchProgress(){const p=state.studentProgress[currentKey()];if(p){state.visited=Array.isArray(p.visited)?[...p.visited]:[];state.gameStars=Number(p.gameStars)||0}else{state.visited=[];state.gameStars=0}}
function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),3000)}
function go(p){const teacherPages=['teacher','teacherSettings','teacherBank'];const studentPages=['home','profile','quizIntro','quizPlay','quizEnd','games','gamePlay','gameEnd'];if(teacherPages.includes(p)&&(!verified||role!=='teacher'))return toast('Masuk ke Mode Guru terlebih dahulu');if(studentPages.includes(p)&&role!=='student')return toast('Masuk ke Mode Siswa terlebih dahulu');page=p;render();scrollTo({top:0,behavior:'instant'})}
function hero(title,sub,badges='',teacher=false){return `<header class="hero"><div class="headerline"><div class="brand"><span class="mark">${teacher?'👩‍🏫':'🔢'}</span><span>${esc(state.school)}</span></div><button class="small-btn" onclick="App.choose()">⇄ Ganti mode</button></div><h1>${title}</h1><p>${sub}</p><div class="hero-badges">${badges}</div></header>`}
function nav(){if(role==='choose')return '';const items=role==='teacher'?[['teacher','📊','Beranda'],['topics','📚','Materi'],['line','↔️','Simulasi'],['teacherBank','📝','Soal'],['teacherSettings','⚙️','Setelan']]:[['home','🏠','Beranda'],['topics','📚','Materi'],['line','↔️','Garis'],['games','🎮','Game'],['quizIntro','📝','Kuis']];return `<nav class="nav" aria-label="Menu ${role}">${items.map(([id,ico,l])=>`<button type="button" aria-label="${l}" class="${page===id||(page==='lesson'&&id==='topics')||(page==='gamePlay'&&id==='games')||(page==='quizPlay'&&id==='quizIntro')?'active':''}" onclick="App.go('${id}')"><span>${ico}</span>${l}</button>`).join('')}</nav>`}
function shell(title,sub,inner){root.innerHTML=`<div class="wrap flat"><div class="page-head"><button class="back" onclick="App.go('${role==='choose'?'choose':role==='teacher'?'teacher':'home'}')" aria-label="Kembali">‹</button><div><h1>${title}</h1><p>${sub}</p></div></div>${inner}</div>${nav()}`}
function chooseMode(){root.innerHTML=`${hero('Petualangan<br>Bilangan Bulat','Media Pembelajaran Interaktif Matematika Kelas VI SD','<span>🚗 Mobil Garis Bilangan</span><span>📚 Belajar Visual</span><span>🏆 Kuis & Nilai</span>')}<div class="wrap"><div class="card"><p class="eyebrow">Pilih jalur petualangan</p><h2>Selamat datang! 👋</h2><p class="small muted">Pilih mode yang akan digunakan untuk memulai kegiatan belajar.</p></div><button class="choice-role" onclick="App.enterStudent()"><span class="em">🎒</span><span><strong>Mode Siswa</strong><p>Belajar materi, bergerak di garis bilangan, bermain game mobil dan mengerjakan kuis.</p></span><span aria-hidden="true">❯</span></button><button class="choice-role teacher" onclick="App.enterTeacher()"><span class="em">👩‍🏫</span><span><strong>Mode Guru</strong><p>Atur kelas dan sekolah, tambah soal, lihat rekap nilai dan unduh hasilnya.</p></span><span aria-hidden="true">❯</span></button><footer class="note">${esc(state.school)} · Versi 1.6</footer></div>`}
function teacherLogin(){if(!state.teacherPin){shell('Aktivasi Mode Guru','Pengaturan guru pada perangkat ini',`<div class="card"><div class="big-emoji">👩‍🏫</div><h2 class="center">Buat akses guru</h2><p class="small muted center">Tetapkan nama guru dan PIN agar siswa tidak mudah membuka halaman rekap.</p><form onsubmit="App.setupTeacher();return false"><div class="form-field"><label class="fieldlabel" for="setupTeacher">Nama Guru</label><input id="setupTeacher" class="field" required maxlength="100" value="${esc(state.teacher)}"></div><div class="form-field"><label class="fieldlabel" for="setupSchool">Nama Sekolah</label><input id="setupSchool" class="field" required maxlength="120" value="${esc(state.school)}"></div><div class="form-grid"><div class="form-field"><label class="fieldlabel" for="setupPin">PIN baru (4–8 angka)</label><input id="setupPin" class="field" type="password" inputmode="numeric" minlength="4" maxlength="8" pattern="[0-9]{4,8}" required autocomplete="new-password"></div><div class="form-field"><label class="fieldlabel" for="setupPin2">Ulangi PIN</label><input id="setupPin2" class="field" type="password" inputmode="numeric" minlength="4" maxlength="8" pattern="[0-9]{4,8}" required autocomplete="new-password"></div></div><button class="btn full" type="submit">Simpan dan masuk →</button></form></div>`);return}shell('Masuk Mode Guru','Area pengaturan dan penilaian',`<div class="card"><div class="big-emoji">🔐</div><h2 class="center">Masukkan PIN Guru</h2><p class="center small muted">Akses guru khusus untuk perangkat ini.</p><form onsubmit="App.verifyTeacher();return false"><div class="form-field"><label class="fieldlabel" for="teacherPin">PIN Guru</label><input class="field" id="teacherPin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" required autofocus></div><button class="btn full" type="submit">Masuk ke Dashboard</button></form><p class="small muted">Jika PIN terlupa, gunakan cadangan data yang pernah disimpan atau minta bantuan pengelola perangkat. Menghapus data browser juga menghapus informasi tersimpan.</p></div>`)}
function home(){const count=state.visited.length;root.innerHTML=`${hero('Halo, '+(state.student?esc(state.student):'Petualang')+'! 👋','Siap menjelajahi dunia bilangan positif dan negatif?','<span>🎒 Kelas '+esc(state.studentClass||'belum diisi')+'</span><span>📖 '+count+'/7 materi</span><span>⭐ '+state.gameStars+' bintang</span>')}<div class="wrap"><div class="card tint"><div class="row"><div><p class="eyebrow">Progres belajarmu</p><div class="stat">${Math.round(count/7*100)}%</div><p class="small muted">${count} dari 7 materi selesai</p></div><div style="font-size:56px">🚀</div></div><div class="progress"><span style="width:${count/7*100}%"></span></div></div>${!state.student||!state.studentClass?`<div class="callout warn">✏️ Lengkapi <strong>nama dan kelas siswa</strong> sebelum memulai kuis. <button class="btn gold" style="margin:8px 0 0;display:block" onclick="App.go('profile')">Isi identitas siswa</button></div>`:''}<div class="section-head"><h2>Mulai petualangan</h2><button class="btn soft" onclick="App.go('profile')">✏️ Profil</button></div><div class="grid"><button class="feature" onclick="App.go('topics')"><span class="em">📚</span><strong>Belajar Materi</strong><small>7 bab singkat dengan contoh sederhana</small></button><button class="feature" onclick="App.go('line')"><span class="em">↔️</span><strong>Garis Bilangan</strong><small>Eksperimen bergerak ke kanan dan kiri</small></button><button class="feature" onclick="App.go('games')"><span class="em">🚗</span><strong>Game Edukasi</strong><small>Mobil, lift, suhu, dan harta karun</small></button><button class="feature" onclick="App.go('quizIntro')"><span class="em">🏆</span><strong>Kuis & Nilai</strong><small>10 soal pilihan ganda dengan pembahasan</small></button></div><footer class="note">Belajar itu menyenangkan • ${esc(state.school)}</footer></div>${nav()}`}
const topics=[

function lineSVG(start,move,showCar=false,answered=true){const end=start+move;const X=n=>36+(n+10)*20;const ticks=Array.from({length:21},(_,i)=>i-10).map(n=>`<g><line x1="${X(n)}" y1="67" x2="${X(n)}" y2="83" stroke="#7d91b9" stroke-width="${n===0?2.3:1.2}"/><text x="${X(n)}" y="104" text-anchor="middle" font-size="12" fill="${n===0?'#27448d':'#6b7c9d'}" font-weight="${n===0?'800':'500'}">${n}</text></g>`).join('');const valid=start>=-10&&start<=10&&end>=-10&&end<=10;const mid=answered?end:start;return `<svg class="numberline" viewBox="0 0 472 130" role="img" aria-label="Garis bilangan dari negatif sepuluh sampai positif sepuluh. Posisi awal ${start}, perpindahan ${move}, hasil ${end}."><line x1="19" y1="67" x2="453" y2="67" stroke="#4962a1" stroke-width="3" stroke-linecap="round"/><path d="M 19 67 l 9 -6 v 12 z M 453 67 l -9 -6 v 12 z" fill="#4962a1"/>${ticks}${valid&&move!==0?`<path d="M${X(start)} 45 Q${(X(start)+X(end))/2} ${move>0?2:20} ${X(end)} 45" stroke="#eea43f" fill="none" stroke-width="3" stroke-linecap="round"/><circle cx="${X(end)}" cy="45" r="4" fill="#eea43f"/>`:''}${valid?`<circle cx="${X(start)}" cy="67" r="8" fill="#3c69dc" stroke="#fff" stroke-width="3"/>${showCar?`<text x="${X(mid)}" y="39" text-anchor="middle" font-size="28">🚗</text>`:`<circle cx="${X(end)}" cy="67" r="8" fill="#15a580" stroke="#fff" stroke-width="3"/>`}`:''}</svg>`}
function linePage(){const end=lineStart+lineMove;shell('Laboratorium Garis Bilangan','Gerakkan bilangan awal dan langkahnya',`<div class="card tint"><span class="tag">🔬 Percobaan bilangan</span><h2 style="margin-top:13px" class="center">${fmt(lineStart)} ${lineMove<0?'−':'+'} ${Math.abs(lineMove)} = <span style="color:#13866b">${fmt(end)}</span></h2><div class="road">${lineSVG(lineStart,lineMove)}</div><div class="callout">${lineMove===0?'Tidak berpindah, sehingga posisi akhir sama dengan awal.':`Dari <strong>${fmt(lineStart)}</strong>, bergerak <strong>${Math.abs(lineMove)} langkah ke ${lineMove<0?'kiri ⬅️':'kanan ➡️'}</strong>, berhenti di <strong>${fmt(end)}</strong>.`}</div></div><div class="grid"><div class="card center"><h3>Bilangan awal</h3><div class="numberbox"><button class="step" aria-label="Kurangi bilangan awal" onclick="App.adjustLine('start',-1)">−</button><span class="number">${fmt(lineStart)}</span><button class="step" aria-label="Tambah bilangan awal" onclick="App.adjustLine('start',1)">+</button></div></div><div class="card center"><h3>Langkah perpindahan</h3><div class="numberbox"><button class="step" aria-label="Kurangi langkah" onclick="App.adjustLine('move',-1)">−</button><span class="number">${fmt(lineMove)}</span><button class="step" aria-label="Tambah langkah" onclick="App.adjustLine('move',1)">+</button></div></div></div><button class="btn soft full" onclick="App.resetLine()">↻ Reset percobaan</button><p class="tiny muted center">Rentang simulasi: −10 sampai +10</p>`)}

function makeGameQuestion(){const a=rnd(-7,7),b=rnd(-6,6),correct=a+b;let question,desc,explain;switch(game){case 'mobil':question=`Mobil mulai dari bilangan ${fmt(a)}. Bergerak ${Math.abs(b)} langkah ke ${b<0?'kiri':b>0?'kanan':'tempat'}. Berhenti di bilangan berapa?`;desc=`🚩 Awal ${fmt(a)} · ${b<0?'⬅️ kiri':b>0?'➡️ kanan':'⏸️ diam'} ${Math.abs(b)} langkah`;explain=`${a} + (${b}) = ${correct}`;break;case 'lift':question=`Lift berada di lantai ${a}. Lift ${b<0?'turun':b>0?'naik':'tetap di tempat'} ${Math.abs(b)} lantai. Sekarang di lantai berapa?`;desc='🛗 Hitung perubahan lantai';explain=`${a} + (${b}) = ${correct}`;break;case 'suhu':question=`Suhu mula-mula ${a}°C, lalu ${b<0?'turun':b>0?'naik':'tidak berubah'} ${Math.abs(b)}°C. Berapa suhu akhirnya?`;desc='🌡️ Hitung perubahan suhu';explain=`${a} + (${b}) = ${correct}°C`;break;default:question=`Harta tersembunyi pada posisi ${a}. Peta menunjukkan pergeseran ${b<0?'ke kiri':'ke kanan'} ${Math.abs(b)} langkah. Di posisi mana hartanya?`;desc='🗝️ Temukan koordinat harta karun';explain=`${a} + (${b}) = ${correct}`}
const candidates=new Set([correct]);let attempts=0;while(candidates.size<4&&attempts++<100){let v=correct+rnd(-9,9);if(v!==correct&&v>=-20&&v<=20)candidates.add(v)}for(let v=-20;candidates.size<4&&v<=20;v++)candidates.add(v);return {a,b,correct,question,desc,explain,options:shuffle([...candidates].slice(0,4)),chosen:null}}

function quizEnd(){const last=reviewData;const score=last?last.score:0;const response=last?.review||[];shell('Hasil Evaluasi','Kuis telah diselesaikan',`<div class="card center"><div class="big-emoji">${score>=80?'🏆':score>=60?'🌟':'💪'}</div><span class="tag ${score>=70?'ok':'warn'}">${score>=80?'Sangat Baik':score>=60?'Terus Tingkatkan':'Ayo Semangat'}</span><div class="score">${score}<span style="font-size:23px">/100</span></div><h2>${esc(state.student||'Petualang')}</h2><p class="small muted">Kelas ${esc(state.studentClass)} · ${esc(state.school)}</p><p>✅ Benar <strong>${last?.correct||0}</strong> dari 10 soal</p><div class="actions"><button class="btn outline" onclick="App.go('topics')">Belajar lagi</button><button class="btn" onclick="App.go('quizIntro')">Coba kuis baru</button></div></div><div class="card"><h3>📋 Pembahasan singkat</h3>${response.map((r,i)=>`<div class="history-row"><div><strong>${i+1}. ${esc(r.question)}</strong><small>Jawabanmu: ${esc(r.selected)} · Benar: ${esc(r.answer)}</small></div><span class="tag ${r.correct?'ok':'warn'}">${r.correct?'✓':'✕'}</span></div>`).join('')}</div>`)}
function formatDate(d){try{return new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}catch(e){return String(d||'')}}
function profilePage(){shell('Profil Siswa','Isi atau ubah identitas sebelum belajar',`<div class="card"><span class="tag ok">🎒 Mode Siswa</span><h2 style="margin-top:12px">Identitas Petualang</h2><p class="small muted">Nama, kelas, dan kode siswa dapat diperbarui. Gunakan <strong>Ganti siswa</strong> jika perangkat ini dipakai bergantian.</p><form onsubmit="App.saveProfile();return false"><div class="form-field"><label class="fieldlabel" for="student">Nama lengkap siswa *</label><input class="field" id="student" required maxlength="100" placeholder="Contoh: Ayu Putri" value="${esc(state.student)}"></div><div class="form-grid"><div class="form-field"><label class="fieldlabel" for="studentClass">Kelas *</label><input class="field" id="studentClass" required maxlength="30" placeholder="Contoh: VI A" value="${esc(state.studentClass)}"></div><div class="form-field"><label class="fieldlabel" for="studentCode">Kode / Nomor Absen (opsional)</label><input class="field" id="studentCode" maxlength="30" placeholder="Contoh: 07" value="${esc(state.studentCode)}"></div></div><label class="fieldlabel">Tujuan perubahan</label><label class="checkboxline" style="margin-bottom:10px"><input type="radio" name="editMode" value="edit" checked> Perbaiki identitas siswa ini (pertahankan nilai)</label><label class="checkboxline" style="margin-bottom:20px"><input type="radio" name="editMode" value="switch"> Ganti ke siswa lain (pisahkan progres)</label><button class="btn full" type="submit">💾 Simpan Profil Siswa</button></form></div><div class="card mint"><h3>📌 Catatan</h3><p class="small muted">Nama dan kelas ikut dicantumkan pada hasil kuis. Dalam mode offline, rekap disimpan di browser perangkat ini. Untuk rekap seluruh perangkat diperlukan server atau database bersama.</p></div>`)}
function teacherPage(){const scores=state.quizHistory.filter(h=>Number.isFinite(Number(h.score)));const avg=scores.length?Math.round(scores.reduce((a,x)=>a+Number(x.score),0)/scores.length):0;const students=new Set(scores.map(h=>studentKey(h.student||'',h.studentCode||'',h.studentClass||''))).size;root.innerHTML=`${hero('Dashboard Guru 📊','Kelola materi, bank soal, dan hasil evaluasi siswa.','<span>👩‍🏫 '+esc(state.teacher||'Guru Kelas VI')+'</span><span>🏫 '+esc(state.school)+'</span>',true)}<div class="wrap"><div class="card"><div class="row"><div><p class="eyebrow">Ringkasan belajar siswa</p><h2 style="margin-bottom:0">Rekap Penilaian</h2></div><button class="btn soft" onclick="App.go('teacherSettings')">⚙️ Setelan</button></div><div class="stats" style="margin-top:15px"><div class="statcard"><div class="stat">${scores.length}</div><small>Hasil kuis</small></div><div class="statcard"><div class="stat">${students}</div><small>Siswa tercatat</small></div><div class="statcard"><div class="stat">${avg}</div><small>Rata-rata nilai</small></div></div></div><div class="grid three"><button class="feature" onclick="App.go('teacherBank')"><span class="em">📝</span><strong>Bank Soal</strong><small>Tambah soal dan pembahasan</small></button><button class="feature" onclick="App.go('topics')"><span class="em">📚</span><strong>Materi</strong><small>Lihat semua bab pelajaran</small></button><button class="feature" onclick="App.go('line')"><span class="em">↔️</span><strong>Simulasi</strong><small>Demonstrasi garis bilangan</small></button></div><div class="card"><div class="row wraprow"><h2>📋 Hasil kuis siswa</h2><button class="btn outline" onclick="App.downloadCSV()" ${scores.length?'':'disabled'}>⬇ Unduh CSV</button></div><label class="fieldlabel" for="scoreSearch">Cari nama, kelas atau kode siswa</label><input id="scoreSearch" class="field" placeholder="Cari siswa / kelas ..." value="${esc(teacherSearch)}" oninput="App.filterScores(this.value)"><div id="teacherHistory">${renderScoreRows(scores)}</div></div><div class="card"><h3>💾 Cadangan Data</h3><p class="small muted">Unduh cadangan lengkap untuk memindahkan data ke perangkat lain atau sebelum menghapus riwayat browser.</p><div class="actions"><button class="btn outline" onclick="App.backup()">⬇ Cadangkan JSON</button><label class="btn soft" style="text-align:center;cursor:pointer">⬆ Pulihkan JSON<input type="file" accept=".json,application/json" style="display:none" onchange="App.restore(event.target)"></label></div></div><footer class="note">Mode Guru · Rekap hanya mencakup hasil kuis yang tersimpan pada perangkat/browser ini</footer></div>${nav()}`;filterScores(teacherSearch)}
function renderScoreRows(scores){if(!scores.length)return `<div class="callout">Belum ada nilai kuis yang tersimpan di perangkat ini.</div>`;return scores.slice().reverse().map(h=>{const search=[h.student,h.studentClass,h.studentCode,h.teacher,h.school].join(' ').toLocaleLowerCase('id-ID');return `<div class="history-row" data-history-row data-search="${esc(search)}"><div><strong>${esc(h.student||'Tanpa nama')} · ${esc(h.studentClass||'Kelas ?')}</strong><small>${esc(h.studentCode||'-')} · ${esc(formatDate(h.date))} · ${esc(h.correct??Math.round(h.score/10))}/10 benar</small></div><span class="value-pill ${Number(h.score)<60?'low':''}">${esc(h.score)}</span></div>`}).join('')+`<p id="filterEmpty" class="callout" hidden>Tidak ditemukan hasil sesuai pencarian.</p>`}
function filterScores(value){teacherSearch=String(value||'').toLocaleLowerCase('id-ID');let count=0;document.querySelectorAll('[data-history-row]').forEach(row=>{const match=(row.dataset.search||'').includes(teacherSearch);row.hidden=!match;if(match)count++});const empty=document.getElementById('filterEmpty');if(empty)empty.hidden=count!==0}
function teacherSettings(){shell('Pengaturan Sekolah','Ubah nama guru, sekolah, atau PIN',`<div class="card"><h2>👩‍🏫 Identitas Guru & Sekolah</h2><form onsubmit="App.saveTeacherSettings();return false"><div class="form-field"><label class="fieldlabel" for="teacherNameSet">Nama Guru</label><input class="field" id="teacherNameSet" required maxlength="100" value="${esc(state.teacher)}"></div><div class="form-field"><label class="fieldlabel" for="teacherSchoolSet">Nama Sekolah</label><input class="field" id="teacherSchoolSet" required maxlength="120" value="${esc(state.school)}"></div><div class="divider"></div><h3>Ubah PIN (opsional)</h3><div class="form-grid"><div class="form-field"><label class="fieldlabel" for="teacherPinSet">PIN baru (4–8 angka)</label><input class="field" id="teacherPinSet" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8"></div><div class="form-field"><label class="fieldlabel" for="teacherPinConfirm">Konfirmasi PIN baru</label><input class="field" id="teacherPinConfirm" type="password" inputmode="numeric" minlength="4" maxlength="8"></div></div><button class="btn full" type="submit">Simpan pengaturan</button></form></div><div class="card"><h3>🔐 Keamanan data</h3><p class="small muted">PIN ini membatasi tampilan Mode Guru pada perangkat yang sama, bukan autentikasi server. Jangan gunakan PIN sebagai sandi penting. Ekspor cadangan secara berkala.</p><button class="btn danger" onclick="App.clearScores()">Hapus semua riwayat nilai di perangkat</button></div>`)}
function teacherBank(){const custom=state.customQuestions.filter(validQuestion);shell('Bank Soal Guru',`${fixedQuestions.length} soal bawaan · ${custom.length} soal tambahan`, `<div class="card"><div class="row"><div><h2>📝 Tambahkan soal kuis</h2><p class="small muted">Setiap soal memiliki empat pilihan dan satu jawaban benar.</p></div><span style="font-size:44px">📖</span></div><form onsubmit="App.addQuestion();return false"><div class="form-field"><label class="fieldlabel" for="newQuestion">Pertanyaan</label><textarea id="newQuestion" class="field" rows="3" required maxlength="500" placeholder="Tulis soal operasi bilangan bulat..."></textarea></div><div class="form-grid">${[0,1,2,3].map(i=>`<div class="form-field"><label class="fieldlabel" for="qOpt${i}">Pilihan ${'ABCD'[i]}</label><input class="field" id="qOpt${i}" required maxlength="160"></div>`).join('')}</div><div class="form-field"><label class="fieldlabel" for="correctOpt">Jawaban benar</label><select class="field" id="correctOpt"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div class="form-field"><label class="fieldlabel" for="newReason">Pembahasan</label><textarea id="newReason" class="field" rows="2" required maxlength="500" placeholder="Jelaskan cara mendapat jawabannya..."></textarea></div><button class="btn full" type="submit">+ Tambah soal</button></form></div><div class="card"><h3>Soal tambahan (${custom.length})</h3>${custom.length?custom.map((q,i)=>`<div class="history-row"><div><strong>${i+1}. ${esc(q.q)}</strong><small>Jawaban: ${esc(q.o[q.a])} · ${esc(q.r)}</small></div><button class="btn danger" onclick="App.deleteQuestion(${i})">Hapus</button></div>`).join(''):'<p class="small muted">Belum ada soal tambahan. Soal bawaan tetap tersedia.</p>'}</div><div class="callout">Soal tambahan dicampur secara acak bersama soal bawaan saat kuis dimulai.</div>`)}
function saveBlob(content,name,type){try{const b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('File siap diunduh')}catch(e){toast('Gagal menyiapkan file unduhan')}}
function dateFile(){return new Date().toISOString().slice(0,10)}
function safeCsv(s){let t=String(s??'');if(/^\s*[=+@\-\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'}
function csvText(){const head=['Nama Siswa','Kode Siswa','Kelas','Nama Guru','Nama Sekolah','Tanggal','Nilai','Jawaban Benar','Total Soal'];const rows=state.quizHistory.map(h=>[h.student,h.studentCode,h.studentClass,h.teacher,h.school,h.date,h.score,h.correct??Math.round(h.score/10),h.total??10]);return [head,...rows].map(r=>r.map(safeCsv).join(',')).join('\r\n')}
window.App={
choose(){role='choose';verified=false;go('choose')},enterStudent(){role='student';verified=false;go('home')},enterTeacher(){role='choose';go('teacherLogin')},go,
setupTeacher(){const name=document.getElementById('setupTeacher')?.value.trim(),school=document.getElementById('setupSchool')?.value.trim(),pin=document.getElementById('setupPin')?.value,repeat=document.getElementById('setupPin2')?.value;if(!name||!school)return toast('Nama guru dan sekolah wajib diisi');if(!/^\d{4,8}$/.test(pin))return toast('PIN wajib terdiri atas 4–8 angka');if(pin!==repeat)return toast('Konfirmasi PIN tidak cocok');state.teacher=name;state.school=school;state.teacherPin=pin;save();verified=true;role='teacher';go('teacher')},
verifyTeacher(){const pin=document.getElementById('teacherPin')?.value;if(pin!==state.teacherPin)return toast('PIN tidak sesuai');verified=true;role='teacher';go('teacher')},
lesson(i){if(!Number.isInteger(i)||i<0||i>=topics.length)return;lesson=i;lessonStep=0;go('lesson')},lessonStep(delta){const t=topics[lesson];if(delta<0&&lessonStep===0)return go('topics');if(delta>0&&lessonStep===t.parts.length-1){if(role==='student'&&!state.visited.includes(lesson)){state.visited.push(lesson);save();toast('Materi berhasil diselesaikan!')}return go('topics')}lessonStep=Math.max(0,Math.min(t.parts.length-1,lessonStep+delta));render()},
adjustLine(which,delta){const a=which==='start'?lineStart+delta:lineStart,b=which==='move'?lineMove+delta:lineMove;if(a<-10||a>10||b<-10||b>10||a+b<-10||a+b>10)return toast('Rentang hasil antara −10 sampai +10');lineStart=a;lineMove=b;render()},resetLine(){lineStart=-3;lineMove=5;render()},
pickGame(id){if(!['mobil','lift','suhu','harta'].includes(id))return;game=id;render()},startGame(){if(role!=='student')return toast('Masuk sebagai siswa');round=0;gamePoints=0;gameAnswered=false;gameQ=makeGameQuestion();go('gamePlay')},answerGame(n){if(role!=='student'||gameAnswered||!gameQ)return;if(!gameQ.options.includes(n))return;gameAnswered=true;gameQ.chosen=n;if(n===gameQ.correct){gamePoints++;state.gameStars++;save()}render()},nextGame(){if(!gameAnswered)return;if(round===4)return go('gameEnd');round++;gameAnswered=false;gameQ=makeGameQuestion();render()},
saveProfile(){if(role!=='student')return;const name=document.getElementById('student')?.value.trim()||'',klass=document.getElementById('studentClass')?.value.trim()||'',code=document.getElementById('studentCode')?.value.trim()||'',mode=document.querySelector('input[name="editMode"]:checked')?.value||'edit';if(!name||!klass)return toast('Isi nama dan kelas siswa terlebih dahulu');const oldKey=currentKey(),newKey=studentKey(name,code,klass);storeProgress();if(newKey!==oldKey){if(mode==='switch'){const p=state.studentProgress[newKey];state.visited=p&&Array.isArray(p.visited)?[...p.visited]:[];state.gameStars=Number(p?.gameStars)||0}else{state.studentProgress[newKey]={...state.studentProgress[oldKey]};delete state.studentProgress[oldKey];for(const h of state.quizHistory){if(studentKey(h.student,h.studentCode,h.studentClass)===oldKey){h.student=name;h.studentClass=klass;h.studentCode=code}}if(state.quizDraft?.owner===oldKey)state.quizDraft.owner=newKey}}state.student=name;state.studentClass=klass;state.studentCode=code;save();toast('Profil siswa berhasil disimpan');go('home')},
startQuiz(){if(role!=='student')return;if(!state.student.trim()||!state.studentClass.trim())return toast('Isi nama dan kelas siswa dahulu');const pool=shuffle(questionsBank());quiz=pool.slice(0,10).map(q=>({...q,o:[...q.o]}));if(quiz.length!==10)return toast('Bank soal kurang dari 10 soal');quizIndex=0;quizResponses=[];quizAnswered=false;state.quizDraft={owner:currentKey(),quiz,index:0,answers:[],answered:false};save();go('quizPlay')},
resumeQuiz(){const d=state.quizDraft;if(!d||d.owner!==currentKey()||!Array.isArray(d.quiz)||d.quiz.length!==10||!d.quiz.every(validQuestion)||!Array.isArray(d.answers)||!Number.isInteger(d.index)||d.index<0||d.index>9)return toast('Tidak ada kuis yang bisa dilanjutkan');quiz=d.quiz;quizIndex=d.index;quizResponses=d.answers;quizAnswered=!!d.answered||Number.isInteger(quizResponses[quizIndex]?.selected);go('quizPlay')},
answerQuiz(i){if(role!=='student'||quizAnswered)return;const q=quiz[quizIndex];if(!q||!Number.isInteger(i)||i<0||i>3)return;quizResponses[quizIndex]={selected:i,correct:i===q.a};quizAnswered=true;state.quizDraft={owner:currentKey(),quiz,index:quizIndex,answers:quizResponses,answered:true};save();render()},
nextQuiz(){if(role!=='student'||!quizAnswered||quiz.length!==10)return;if(quizIndex===9){const correct=quizResponses.filter(r=>r?.correct).length;const h={student:state.student,studentCode:state.studentCode,studentClass:state.studentClass,teacher:state.teacher,school:state.school,date:new Date().toISOString(),score:correct*10,correct,total:10,review:quiz.map((q,i)=>({question:q.q,selected:q.o[quizResponses[i]?.selected]||'',answer:q.o[q.a],correct:!!quizResponses[i]?.correct}))};state.quizHistory.push(h);state.quizHistory=state.quizHistory.slice(-500);reviewData=h;state.quizDraft=null;save();go('quizEnd')}else{quizIndex++;quizAnswered=false;state.quizDraft={owner:currentKey(),quiz,index:quizIndex,answers:quizResponses,answered:false};save();render()}},
saveTeacherSettings(){if(!verified||role!=='teacher')return;const name=document.getElementById('teacherNameSet')?.value.trim(),school=document.getElementById('teacherSchoolSet')?.value.trim(),pin=document.getElementById('teacherPinSet')?.value||'',confirmPin=document.getElementById('teacherPinConfirm')?.value||'';if(!name||!school)return toast('Nama guru dan sekolah wajib diisi');if(pin||confirmPin){if(!/^\d{4,8}$/.test(pin)||pin!==confirmPin)return toast('PIN baru harus 4–8 angka dan konfirmasi sama');state.teacherPin=pin}state.teacher=name;state.school=school;save();toast('Pengaturan tersimpan');go('teacher')},
addQuestion(){if(!verified||role!=='teacher')return;const q=document.getElementById('newQuestion')?.value.trim(),o=[0,1,2,3].map(i=>document.getElementById('qOpt'+i)?.value.trim()),a=Number(document.getElementById('correctOpt')?.value),r=document.getElementById('newReason')?.value.trim();if(!q||o.some(v=>!v)||!r)return toast('Lengkapi soal, pilihan, dan pembahasan');if(new Set(o.map(v=>v.toLocaleLowerCase('id-ID'))).size!==4)return toast('Semua pilihan jawaban harus berbeda');if(!Number.isInteger(a)||a<0||a>3)return;state.customQuestions.push({q,o,a,r});save();toast('Soal berhasil ditambah');go('teacherBank')},
deleteQuestion(i){if(!verified||role!=='teacher')return;if(!Number.isInteger(i)||i<0||i>=state.customQuestions.length)return;if(!confirm('Hapus soal tambahan ini?'))return;state.customQuestions.splice(i,1);save();go('teacherBank')},filterScores,
downloadCSV(){if(!verified||role!=='teacher')return;saveBlob('\uFEFF'+csvText(),'Nilai_Bilangan_Bulat_'+dateFile()+'.csv','text/csv;charset=utf-8')},
backup(){if(!verified||role!=='teacher')return;const d={...state,teacherPin:''};saveBlob(JSON.stringify({app:'petualangan-bilangan-bulat',version:16,exportedAt:new Date().toISOString(),state:d},null,2),'Cadangan_Bilangan_Bulat_'+dateFile()+'.json','application/json')},
restore(input){if(!verified||role!=='teacher')return;const f=input.files?.[0];if(!f)return;if(f.size>4*1024*1024){toast('File terlalu besar');input.value='';return}f.text().then(txt=>{const data=JSON.parse(txt);if(data.app!=='petualangan-bilangan-bulat'||!data.state||!Array.isArray(data.state.quizHistory)||typeof data.state.student!=='string')throw Error('Format tidak didukung');if(!confirm('Pulihkan cadangan? Data saat ini akan diganti.'))return;const pin=state.teacherPin;state={...defaults,...data.state,teacherPin:pin};for(const k of ['visited','quizHistory','customQuestions'])if(!Array.isArray(state[k]))state[k]=[];if(!state.studentProgress||typeof state.studentProgress!=='object')state.studentProgress={};state.customQuestions=state.customQuestions.filter(validQuestion);state.schoolUpdatedToKecipir=true;save();toast('Cadangan berhasil dipulihkan');go('teacher')}).catch(()=>toast('File cadangan tidak dikenali')).finally(()=>{input.value=''})},
clearScores(){if(!verified||role!=='teacher')return;if(!confirm('Anda yakin ingin MENGHAPUS semua riwayat nilai di perangkat ini?'))return;state.quizHistory=[];state.quizDraft=null;save();toast('Riwayat nilai berhasil dihapus');go('teacher')}
};
function render(){try{switch(page){case 'choose':chooseMode();break;case 'teacherLogin':teacherLogin();break;case 'teacher':if(verified&&role==='teacher')teacherPage();else chooseMode();break;case 'teacherSettings':if(verified&&role==='teacher')teacherSettings();else chooseMode();break;case 'teacherBank':if(verified&&role==='teacher')teacherBank();else chooseMode();break;case 'home':home();break;case 'profile':profilePage();break;case 'topics':topicsPage();break;case 'lesson':lessonPage();break;case 'line':linePage();break;case 'games':gameIntro();break;case 'gamePlay':gamePlay();break;case 'gameEnd':gameEnd();break;case 'quizIntro':quizIntro();break;case 'quizPlay':quizPlay();break;case 'quizEnd':quizEnd();break;default:chooseMode()}}catch(e){console.error('Petualangan render error',e);root.innerHTML=`<div class="wrap flat"><div class="card"><h2>⚠️ Aplikasi mengalami kendala</h2><p class="small muted">Segarkan halaman, atau kembali ke halaman awal. Data yang telah disimpan tidak otomatis terhapus.</p><button class="btn" onclick="App.choose()">Kembali ke awal</button></div></div>`}}
render();
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(e=>console.warn('SW registration',e)));
})();
</script>
</body></html>
